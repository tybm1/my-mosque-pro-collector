name: Collect jamaat times

on:
  schedule:
    - cron: "20 0 * * *"     # every day 00:20 UTC (01:20 UK summer time, 00:20 winter): many sites only show today's times, so read them just after midnight
    - cron: "35 23 * * *"    # summer time: 00:35 UK — read today-only sites soon after midnight (in winter it finds nothing missing and stops)
    - cron: "20 5 * * *"     # retry: re-read only sites still missing today's times
    - cron: "20 11 * * *"    # final retry + strict check (fails, and GitHub emails you, if under 95%)
    - cron: "30 4 * * 1"     # Mondays: find timetables for mosques with no website on file
  workflow_dispatch:          # "Run workflow" button in GitHub for a manual run
    inputs:
      learn_limit:
        description: "Websites to learn recipes for in this run"
        default: "400"
      profile_limit:
        description: "Mosque websites to read for Jumu'ah / sisters / facilities in this run"
        default: "200"
      discover:
        description: "Also look up mosques without a website (Google Places)"
        type: boolean
        default: false

concurrency: collector       # never two runs at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install headless browser (for sites that show times with JavaScript)
        run: python -m playwright install --with-deps chromium

      - name: Collect today's jamaat times (first, so they're ready as early as possible)
        if: github.event.schedule == '20 0 * * *' || github.event_name == 'workflow_dispatch'
        run: python -m collector.run
        continue-on-error: true

      - name: Find timetables for mosques without a website (Mondays or when asked)
        if: github.event.schedule == '30 4 * * 1' || inputs.discover
        run: |
          if [ -n "$GOOGLE_PLACES_KEY" ]; then python -m collector.places --limit 150
          elif [ -n "$BRAVE_SEARCH_KEY" ]; then python -m collector.discover --limit 200
          else echo "No GOOGLE_PLACES_KEY or BRAVE_SEARCH_KEY set — skipping"; fi
        continue-on-error: true

      - name: Learn recipes for new or changed websites
        if: github.event.schedule == '20 0 * * *' || github.event_name == 'workflow_dispatch'
        run: python -m collector.learn --limit ${{ inputs.learn_limit || '150' }}
        continue-on-error: true

      - name: Read new mosque websites once for Jumu'ah times, sisters' area and facilities
        if: github.event.schedule == '20 0 * * *' || github.event_name == 'workflow_dispatch'
        run: python -m collector.profile --limit ${{ inputs.profile_limit || '200' }}
        continue-on-error: true

      - name: Re-check Jumu'ah times (each mosque weekly; AI only when the page changed)
        if: github.event.schedule == '20 0 * * *'
        run: python -m collector.profile --jumuah --limit 400
        continue-on-error: true

      - name: Retry sites still missing today's times
        if: github.event.schedule != '30 4 * * 1'
        run: python -m collector.run --missing

      - name: Check every readable mosque has today's times
        if: github.event.schedule != '30 4 * * 1'
        run: python -m collector.check ${{ github.event.schedule == '20 11 * * *' && '--strict' || '' }}
