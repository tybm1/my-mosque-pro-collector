name: Export jamaat times
# Push anything to the "export" branch to run; the CSV is committed to the "export-data" branch.
on:
  push:
    branches: [export]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/page_dump.py
        env:
          PYTHONPATH: .
        continue-on-error: true
      - run: python scripts/debug_sources.py
        env:
          PYTHONPATH: .
        continue-on-error: true
      - run: python scripts/load_manual_jamaat.py
        env:
          PYTHONPATH: .
      - run: python scripts/clean_jumuah_notes.py
        env:
          PYTHONPATH: .
      - run: python scripts/export_jamaat.py
        env:
          PYTHONPATH: .
      - run: python scripts/export_jumuah.py
        env:
          PYTHONPATH: .
      - name: Commit CSV to export-data branch
        run: |
          git config user.name "My Mosque Pro"
          git config user.email "noreply@anthropic.com"
          cp exports/jamaat.csv exports/jumuah.csv /tmp/ && cp -r exports/pages /tmp/pages || true
          git fetch origin export-data || true
          git checkout -B export-data
          git rm -rq --cached . || true
          mkdir -p exports && cp /tmp/jamaat.csv /tmp/jumuah.csv exports/ && (cp -r /tmp/pages exports/ || true)
          git add -f exports
          git commit -qm "Export $(date -u +%F)"
          git push -f origin export-data
