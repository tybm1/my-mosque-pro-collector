name: Check listings (Google Places)

# Checks every mosque is still open and at its address. Runs on the 1st of each
# month (each mosque re-checked every 90 days) or by hand: Actions → Run workflow.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Mosques to check in this run (Google's free monthly allowance covers about 2,500)"
        default: "2600"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.verify --limit ${{ inputs.limit || '1000' }}
